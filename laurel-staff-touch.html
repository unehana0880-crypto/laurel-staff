<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>손의 순서 — 로렐스튜디오 테라피스트 교육</title>
<style>
:root{
  --paper:#FDFCFA; --line:#23272E; --soft:#8A919C; --rule:#E6E3DE;
  --skin:#F6E3D8; --skinline:#D9BCAC;
  --path:#2E7D6E; --warn:#B4442F; --wash:#F2EFEA;
  --say:#2B5C86;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;
  background:var(--wash);color:var(--line);
  display:flex;flex-direction:column;align-items:center;
  min-height:100vh;padding:18px 14px 40px;line-height:1.5;
}
.shell{width:100%;max-width:440px}
header{text-align:center;margin-bottom:14px}
h1{font-size:20px;font-weight:700;letter-spacing:-.02em}
.tag{font-size:13px;color:var(--soft);margin-top:3px}

.chapter{
  display:flex;gap:6px;margin:14px 0 10px;
}
.chapter button{
  flex:1;font:inherit;font-size:12.5px;font-weight:600;padding:8px 4px;white-space:nowrap;
  border:1px solid var(--rule);background:#fff;border-radius:8px;
  cursor:pointer;color:var(--soft);
}
.chapter button[aria-pressed="true"]{background:var(--line);color:#fff;border-color:var(--line)}
.chapter button:focus-visible{outline:2px solid var(--path);outline-offset:2px}

.dots{display:flex;gap:3px;justify-content:center;margin-bottom:12px}
.dots button{
  flex:1;height:4px;border:none;border-radius:2px;background:var(--rule);
  cursor:pointer;padding:0;transition:background .2s;
}
.dots button[aria-current="true"]{background:var(--line)}
.dots button:focus-visible{outline:2px solid var(--path);outline-offset:3px}

.stage{background:var(--paper);border:1px solid var(--rule);border-radius:14px;overflow:hidden;position:relative}
svg{display:block;width:100%;height:auto}
.step-no{position:absolute;top:13px;left:15px;font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.timer{position:absolute;top:0;left:0;height:2px;background:var(--path);width:0;transition:width .1s linear}

.copy{padding:18px 20px 20px;border-top:1px solid var(--rule);background:var(--paper)}
.copy h2{font-size:17px;font-weight:700;margin-bottom:7px;letter-spacing:-.01em}
.copy p{font-size:14.5px;line-height:1.65;color:#40454E}
.say{
  margin-top:10px;padding:9px 12px;background:#EEF4FA;border-radius:7px;
  font-size:14px;color:var(--say);font-weight:600;
}
.say em{font-style:normal;display:block;font-size:12.5px;font-weight:400;color:#5D7E9C;margin-top:2px}
.warn{
  margin-top:11px;padding:10px 12px;background:#FBF1EE;
  border-left:3px solid var(--warn);border-radius:0 6px 6px 0;
  font-size:13.5px;color:var(--warn);line-height:1.55;
}
.ctrl{display:flex;gap:7px;margin-top:13px}
.ctrl button{
  font:inherit;font-size:14.5px;font-weight:600;padding:12px;border-radius:9px;
  cursor:pointer;border:1px solid var(--line);flex:1;background:#fff;color:var(--line);
}
.ctrl .play{background:var(--line);color:#fff;flex:1.6}
.ctrl button:focus-visible{outline:2px solid var(--path);outline-offset:2px}

.legend{
  margin-top:16px;padding:13px 15px;background:var(--paper);
  border:1px solid var(--rule);border-radius:10px;
  font-size:12.5px;color:var(--soft);line-height:1.7;
}
.legend b{color:var(--line);font-weight:600}
.legend .sw{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--path);margin-right:5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

  <header>

    거의 안 보일 정도가 맞습니다.
  </div>

</div>

var CH = ['1부 맞이하기','2부 케어','3부 손의 무게'];
var idx=0, playing=false, raf=null, t0=0, timer=null;

/* 챕터 버튼 */
var chBox = $('chapter');
CH.forEach(function(name,i){
  var b=document.createElement('button');
  b.type='button'; b.textContent=name;
  b.addEventListener('click',function(){
    stop();
    for(var k=0;k<STEPS.length;k++) if(STEPS[k].ch===i){ go(k); break; }
  });
  chBox.appendChild(b);
});

/* 점 */
var dotBox = $('dots');
STEPS.forEach(function(s,i){
  var b=document.createElement('button');
  b.type='button'; b.setAttribute('aria-label',(i+1)+'단계 '+s.title);
  b.addEventListener('click',function(){ stop(); go(i); });
  dotBox.appendChild(b);
});

function clear(el){ while(el.firstChild) el.removeChild(el.firstChild); }
function el(tag,attrs,parent){
  var e=document.createElementNS(NS,tag);
  for(var k in attrs) e.setAttribute(k,attrs[k]);
  (parent||$('scene')).appendChild(e); return e;
}
function txt(x,y,s,size,color,anchor){
  var t=el('text',{x:x,y:y,'font-size':size||11,fill:color||'#A8A29A',
    'text-anchor':anchor||'middle','font-family':'-apple-system,sans-serif'});
  t.textContent=s; return t;
}

function drawGuides(step){
  var g=$('guides'); clear(g);
  (step.pts||[]).forEach(function(seg){
    var d='M'+seg.map(function(p){return p[0]+' '+p[1];}).join(' L');
    var p=document.createElementNS(NS,'path');
    p.setAttribute('d',d); p.setAttribute('fill','none');
    p.setAttribute('stroke','#2E7D6E'); p.setAttribute('stroke-width','1.8');
    p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-dasharray','4 4');
    p.setAttribute('opacity','.45');
    if(step.arrow) p.setAttribute('marker-end','url(#ah)');
    g.appendChild(p);
  });
}

function lerp(a,b,t){ return a+(b-a)*t; }
function posOn(seg,t){
  var n=seg.length-1, f=t*n, i=Math.min(Math.floor(f),n-1), r=f-i;
  return [lerp(seg[i][0],seg[i+1][0],r), lerp(seg[i][1],seg[i+1][1],r)];
}

function run(step){
  var hand=$('hand'), segs=step.pts||[], dur=step.t*1000;
  if(!segs.length){
    hand.setAttribute('opacity','0');
    var st=performance.now();
    (function tick(){
      var e=performance.now()-st;
      $('timer').style.width=Math.min(100,e/dur*100)+'%';
      if(e<dur) raf=requestAnimationFrame(tick);
      else if(playing) next();
    })();
    return;
  }
  hand.setAttribute('opacity','1');
  var each=dur/segs.length;
  (function frame(){
    var e=performance.now()-t0;
    if(e>dur){ if(playing){ next(); return; } e=dur-1; }
    var si=Math.min(Math.floor(e/each),segs.length-1);
    var lt=(e-si*each)/each;
    var p=posOn(segs[si],Math.max(0,Math.min(1,lt)));
    hand.setAttribute('transform','translate('+p[0]+','+p[1]+')');
    $('timer').style.width=Math.min(100,e/dur*100)+'%';
    raf=requestAnimationFrame(frame);
  })();
}

function go(i){
  idx=(i+STEPS.length)%STEPS.length;
  var s=STEPS[idx];
  Array.prototype.forEach.call(dotBox.children,function(b,k){
    b.setAttribute('aria-current',k===idx?'true':'false');
  });
  Array.prototype.forEach.call(chBox.children,function(b,k){
    b.setAttribute('aria-pressed',k===s.ch?'true':'false');
  });
  $('stepNo').textContent=(idx+1)+' / '+STEPS.length;
  $('title').textContent=s.title;
  $('desc').textContent=s.desc;

  if(s.say){
    var parts=s.say.split('|');
    $('say').style.display='block';
    $('say').innerHTML='“'+parts[0]+'”<em>'+(parts[1]||'')+'</em>';
  } else $('say').style.display='none';

  if(s.warn){ $('warn').style.display='block'; $('warn').textContent=s.warn; }
  else $('warn').style.display='none';

  drawScene(s); drawGuides(s);
  if(raf) cancelAnimationFrame(raf);
  if(timer) clearTimeout(timer);
  t0=performance.now();
  $('timer').style.width='0%';
  run(s);
}

function next(){ if(idx===STEPS.length-1){ stop(); go(0); } else go(idx+1); }
function stop(){ playing=false; $('play').textContent='처음부터 보기'; }

$('play').addEventListener('click',function(){
  if(playing) stop();
  else { playing=true; $('play').textContent='멈추기'; go(0); }
});
$('prev').addEventListener('click',function(){ stop(); go(idx-1); });
$('next').addEventListener('click',function(){ stop(); go(idx+1); });

go(0);
})();
